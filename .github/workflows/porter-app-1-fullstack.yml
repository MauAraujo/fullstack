"on":
    push:
        branches:
            - main
name: Deploy to fullstack
jobs:
    porter-deploy:
        runs-on: arc-runner-set
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set Github tag
              id: vars
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            - name: Setup porter
              uses: porter-dev/setup-porter@v0.2.0
            - name: Deploy stack
              timeout-minutes: 30
              run: porter apply
              env:
                PORTER_APP_NAME: fullstack
                PORTER_CLUSTER: "1"
                PORTER_DEPLOYMENT_TARGET_ID: 9b3c5d94-1eb2-4778-8d18-3a147082a730
                PORTER_HOST: https://mauricio.withporter.run
                PORTER_PROJECT: "1"
                PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
                PORTER_TOKEN: ${{ secrets.PORTER_APP_1_2 }}
