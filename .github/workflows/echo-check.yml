name: Echo Check

on:
  push:
  workflow_dispatch:

jobs:
  echo-check:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Call echo server and check response
        run: |
          # echo server reflects back query params under .request.query
          response=$(curl -sS "https://echo.dev-porter.run/get?message=hello" 2>curl_err)
          curl_status=$?

          echo "curl exit status: $curl_status"
          echo "Response: $response"
          echo "Errors: $(cat curl_err)"

          if [ "$curl_status" -ne 0 ]; then
            exit 1
          fi

          expected="hello"
          actual=$(echo "$response" | jq -r '.request.query.message')

          if [ "$actual" = "$expected" ]; then
            echo "Match: args.message = '$actual'"
          else
            echo "Mismatch: expected '$expected', got '$actual'"
            exit 1
          fi
