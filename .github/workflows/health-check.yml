name: Health Check

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check endpoint health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://fullstack.internal.dev-porter.run/health)
          echo "HTTP status: $response"
          if [ "$response" != "200" ]; then
            echo "::error::Health check failed with status $response"
            exit 1
          fi
